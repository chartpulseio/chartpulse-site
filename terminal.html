<style>
:root{--bg:#05060a;--pn:rgba(14,17,24,.78);--pn2:#0b0e14;--ln:rgba(120,140,170,.14);--ln2:rgba(255,176,46,.28);--tx:#e6ebf3;--mu:#7d8798;--am:#ffb02e;--am2:#ffd27a;--up:#1ee08a;--dn:#ff4d6a;--bl:#4db3ff;--vi:#a78bfa;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--glow:0 0 0 1px rgba(255,176,46,.18),0 8px 30px rgba(0,0,0,.55)}
*{box-sizing:border-box}html,body{margin:0;color:var(--tx);font:13px/1.45 Inter,system-ui,sans-serif;background:var(--bg)}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(77,179,255,.10),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(255,176,46,.08),transparent 60%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px) 0 0/100% 28px,var(--bg)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#232a36;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.tm{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 64px);min-height:660px;padding:8px;gap:8px}
.cmd{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:linear-gradient(180deg,rgba(20,24,33,.92),rgba(10,12,17,.92));box-shadow:var(--glow);backdrop-filter:blur(10px)}
.cmd b{color:#000;background:linear-gradient(135deg,var(--am),#ff7a18);font:800 12px var(--mono);letter-spacing:.1em;padding:6px 9px;border-radius:7px;box-shadow:0 0 18px rgba(255,140,30,.45)}
.cmd input{flex:1;background:rgba(0,0,0,.55);border:1px solid rgba(255,176,46,.25);color:var(--am2);font:600 14px var(--mono);padding:9px 12px;border-radius:8px;outline:none;text-transform:uppercase;letter-spacing:.04em;caret-color:var(--am)}
.cmd input::placeholder{color:#5c6476;text-transform:none;letter-spacing:0}
.cmd input:focus{border-color:var(--am);box-shadow:0 0 0 3px rgba(255,176,46,.15),inset 0 0 20px rgba(255,176,46,.05)}
.cmd .clock{font:600 11px var(--mono);color:var(--mu);white-space:nowrap;padding:5px 9px;border:1px solid var(--ln);border-radius:7px;background:rgba(0,0,0,.35)}
.cmd .clock.am{color:var(--am);border-color:var(--ln2);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,176,46,.35)}}
.grid{display:grid;grid-template-columns:310px 1fr 370px;gap:8px;min-height:0}
.pn{background:var(--pn);display:flex;flex-direction:column;min-height:0;border:1px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:var(--glow);backdrop-filter:blur(12px);position:relative}
.pn::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,176,46,.55),transparent)}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);font:800 10.5px var(--mono);letter-spacing:.14em;color:var(--am2);text-transform:uppercase;background:linear-gradient(180deg,rgba(255,176,46,.06),transparent)}
.ph::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.ph .sp{flex:1}.ph small{color:var(--mu);font-weight:600;letter-spacing:0;padding:1px 7px;border:1px solid var(--ln);border-radius:20px}
.bd{overflow:auto;flex:1;min-height:0}
.tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--ln);flex-wrap:wrap;align-items:center}
.tabs button{background:rgba(255,255,255,.03);border:1px solid var(--ln);color:var(--mu);font:700 10.5px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:6px;cursor:pointer;transition:.15s}
.tabs button:hover{color:var(--tx);border-color:rgba(255,176,46,.4)}
.tabs button.on{color:#0a0a0a;background:linear-gradient(135deg,var(--am),#ff8a1f);border-color:transparent;box-shadow:0 0 14px rgba(255,150,40,.35)}
table{width:100%;border-collapse:collapse;font:12px var(--mono)}
td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.035);white-space:nowrap;position:relative}
tr.r{cursor:pointer;transition:background .12s}tr.r:hover td{background:rgba(77,179,255,.06)}tr.sel td{background:rgba(255,176,46,.09)}tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--am)}
.up{color:var(--up);text-shadow:0 0 10px rgba(30,224,138,.25)}.dn{color:var(--dn);text-shadow:0 0 10px rgba(255,77,106,.25)}.mu{color:var(--mu)}.am{color:var(--am)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2b313c;margin-right:6px;vertical-align:1px}.dot.on{background:var(--up);box-shadow:0 0 8px var(--up)}
.chip{display:inline-block;font:800 9.5px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:20px;border:1px solid var(--ln);color:var(--mu);background:rgba(255,255,255,.02)}
.chip.b{color:var(--up);border-color:rgba(30,224,138,.35);background:rgba(30,224,138,.08)}.chip.s{color:var(--dn);border-color:rgba(255,77,106,.35);background:rgba(255,77,106,.08)}
.chip.a{color:#0a0a0a;background:linear-gradient(135deg,var(--am2),var(--am));border-color:transparent;box-shadow:0 0 10px rgba(255,176,46,.4)}
.heat{position:absolute;left:0;bottom:0;height:2px;border-radius:2px;opacity:.85}
.flash-up{animation:fu 1.2s ease-out}.flash-dn{animation:fd 1.2s ease-out}
@keyframes fu{0%{background:rgba(30,224,138,.28)}100%{background:transparent}}@keyframes fd{0%{background:rgba(255,77,106,.28)}100%{background:transparent}}
.sym{padding:14px 16px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;background:linear-gradient(90deg,rgba(77,179,255,.07),transparent 60%)}
.sym h2{margin:0;font:800 22px var(--mono);letter-spacing:.02em;background:linear-gradient(90deg,#fff,var(--am2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sym .px{font:800 22px var(--mono)}.sym .nm{color:var(--mu)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}
.kv div{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.kv i{display:block;font:normal 9.5px var(--mono);letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-bottom:3px}.kv b{font:700 15px var(--mono)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view iframe{flex:1;border:0;width:100%;min-height:440px;background:#000}
.list{padding:8px 12px}.list .it{padding:8px 10px;margin:6px 0;border:1px solid rgba(255,255,255,.04);border-radius:8px;background:rgba(255,255,255,.02)}
.list a{color:var(--tx);text-decoration:none}.list a:hover{color:var(--am2)}
.right{display:grid;grid-template-rows:1fr 1fr 1fr;gap:8px;min-height:0}
.tick{border:1px solid var(--ln);border-radius:10px;background:linear-gradient(90deg,rgba(10,12,17,.95),rgba(16,20,28,.95));overflow:hidden;white-space:nowrap;font:600 12px var(--mono);padding:7px 0;box-shadow:var(--glow);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick span{display:inline-block;padding:0 18px;border-right:1px solid var(--ln)}
.tick .in{display:inline-block;animation:tk 110s linear infinite}@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#chart{flex:1;min-height:440px}
.tfb{display:flex;gap:6px;padding:8px 12px;align-items:center}.tfb button{background:rgba(255,255,255,.03);border:1px solid var(--ln);color:var(--mu);font:700 11px var(--mono);padding:3px 10px;border-radius:6px;cursor:pointer}.tfb button.on{color:#0a0a0a;background:linear-gradient(135deg,var(--am),#ff8a1f);border-color:transparent}
.imp-High{color:var(--dn);text-shadow:0 0 8px var(--dn)}.imp-Medium{color:var(--am)}.imp-Low,.imp-Holiday{color:var(--mu)}
.frm{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln);font:12px var(--mono)}
.frm select,.frm input{background:rgba(0,0,0,.5);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font:12px var(--mono);padding:4px 8px}
.help{padding:18px;font:12.5px/1.9 var(--mono);color:var(--mu)}.help b{color:var(--am2)}
.empty{padding:16px;color:var(--mu);font:12px var(--mono)}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--ln)}
.btns a{font:700 10.5px var(--mono);letter-spacing:.04em;color:var(--am2);border:1px solid var(--ln2);padding:4px 10px;border-radius:20px;text-decoration:none;background:rgba(255,176,46,.05);transition:.15s}.btns a:hover{background:rgba(255,176,46,.15);box-shadow:0 0 12px rgba(255,176,46,.25)}
code{color:var(--am2)}
@media(max-width:1180px){.grid{grid-template-columns:1fr}.tm{height:auto}.right{grid-template-rows:auto}.bd{max-height:440px}.kv{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="tm" id="main">
  <div class="cmd"><b>CP&gt;</b><input id="q" list="syms" placeholder="Type a symbol or command: XAUUSD GEX · NIFTY · GF · CF · NEWS · HELP" autocomplete="off" autofocus><datalist id="syms"></datalist><span class="clock am" id="nx"></span><span class="clock" id="clk"></span></div>
  <div class="grid">
    <section class="pn">
      <div class="ph">Watchlist<span class="sp"></span><small id="wcount"></small></div>
      <div class="tabs" id="mk"></div>
      <div class="bd"><table><tbody id="wl"></tbody></table></div>
    </section>
    <section class="pn">
      <div class="sym" id="hd"><span class="mu">Pick a symbol from the watchlist or type one above.</span></div>
      <div class="kv" id="kv"></div>
      <div class="tabs" id="vt"></div>
      <div class="btns" id="links"></div>
      <div class="view" id="vw"><div class="help" id="help"></div></div>
    </section>
    <section class="right">
      <div class="pn"><div class="ph">God-father A+ / A<span class="sp"></span><small id="gfn"></small></div><div class="bd"><table><tbody id="gf"></tbody></table></div></div>
      <div class="pn"><div class="ph">Confluence · Rejection / GO<span class="sp"></span><small id="cfn"></small></div><div class="bd"><table><tbody id="cf"></tbody></table></div></div>
      <div class="pn"><div class="ph">News · High impact<span class="sp"></span><small id="nwn"></small></div><div class="bd list" id="nw"></div></div>
    </section>
  </div>
  <div class="tick"><div class="in" id="tk"></div></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const E = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const S = { rows: [], by: {}, mk: "ALL", sel: null, view: "OVERVIEW", gf: [], cf: [], nw: [], gexList: [], board: [], econ: [], tf: "1H", alerts: [], seen: null, alertsOn: false, chart: null };
const LS = { get(k, d) { try { const v = localStorage.getItem("cpt_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("cpt_" + k, JSON.stringify(v)); } catch (e) {} } };
const MK = [["ALL", () => true], ["US", r => /stock|etf|index/i.test(r.market || "") && !/\.NS$|^\^NSE|NIFTY/.test(r.symbol)], ["INDIA", r => /\.NS$|^\^NSE|^\^CNX|NIFTY/.test(r.symbol)], ["FX", r => /=X$/.test(r.symbol)], ["CMDTY", r => /=F$/.test(r.symbol)], ["CRYPTO", r => /-USD$/.test(r.symbol)]];
const GEXMAP = { "^NSEI": "NIFTY", "^NSEBANK": "BANKNIFTY", "NIFTY_FIN_SERVICE.NS": "FINNIFTY", "BTC-USD": "BTC", "ETH-USD": "ETH", "GC=F": "GLD", "SI=F": "SLV", "CL=F": "USO", "^GSPC": "SPY", "^NDX": "QQQ", "^RUT": "IWM", "^DJI": "DIA" };
const VIEWS = ["OVERVIEW", "CHART", "GEX", "ZONES", "NEWS", "WHY"];
const GLOBAL = ["CAL", "ALERTS", "SCREEN", "JOURNAL"];
const pct = v => v == null ? "–" : (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "mu";
const px = v => v == null ? "–" : Number(v) >= 100 ? Number(v).toFixed(2) : Number(v).toFixed(Number(v) >= 1 ? 4 : 6);
const side = b => /PUT|DOWN|SELL|BEAR/i.test(b || "") ? "s" : /CALL|UP|BUY|BULL/i.test(b || "") ? "b" : "";
const sideTxt = b => side(b) === "s" ? "SELL" : side(b) === "b" ? "BUY" : "–";
const gexOf = s => { const g = GEXMAP[s] || s.replace(/^\^/, ""); return S.gexList.includes(g) ? g : null; };
async function J(u) { try { const r = await fetch(u, { cache: "no-store", credentials: "same-origin" }); return r.ok ? await r.json() : null; } catch (e) { return null; } }

function drawTabs() {
  $("mk").innerHTML = MK.map(([k]) => `<button class="${k === S.mk ? "on" : ""}" data-k="${k}">${k}</button>`).join("");
  $("vt").innerHTML = VIEWS.map(k => `<button class="${k === S.view && S.sel ? "on" : ""}" data-v="${k}">${k}</button>`).join("") + `<span style="flex:1"></span>` + GLOBAL.map(k => `<button data-g="${k}">${k}</button>`).join("");
}
function drawWatch() {
  const f = MK.find(m => m[0] === S.mk)[1];
  const rows = S.rows.filter(f).sort((a, b) => (b.live === true) - (a.live === true) || Math.abs(b.change_pct || 0) - Math.abs(a.change_pct || 0)).slice(0, 400);
  $("wcount").textContent = rows.length + " mkts";
  const prev = S.prev || {}; S.prev = {};
  $("wl").innerHTML = rows.map(r => { const p0 = prev[r.symbol]; S.prev[r.symbol] = r.price; const fl = p0 != null && r.price != null && r.price !== p0 ? (r.price > p0 ? " flash-up" : " flash-dn") : ""; const w = Math.min(100, Math.abs(Number(r.change_pct) || 0) * 25); return `<tr class="r${r.symbol === S.sel ? " sel" : ""}${fl}" data-s="${E(r.symbol)}"><td><span class="dot${r.live ? " on" : ""}"></span>${E(r.symbol)}</td><td>${px(r.price)}</td><td class="${cls(r.change_pct)}">${pct(r.change_pct)}<span class="heat" style="width:${w}%;background:${(r.change_pct || 0) >= 0 ? "var(--up)" : "var(--dn)"}"></span></td><td><span class="chip ${side(r.bias)}">${sideTxt(r.bias)}</span></td></tr>`; }).join("") || `<tr><td class="empty">Loading markets…</td></tr>`;
}
function setupsFor(s) {
  const out = [];
  S.gf.filter(r => r.symbol === s).forEach(r => out.push(`God-father <span class="chip a">${E(r.grade)}</span> ${sideTxt(r.side)} · ${E(r.setup_name || r.setup || "")}`));
  S.cf.filter(r => r.symbol === s).forEach(r => out.push(`Confluence <b>${E(r.stage_name)}</b> ${sideTxt(r.bias)} · zone ${px(r.zone?.[0])}–${px(r.zone?.[1])}`));
  return out;
}
function drawSymbol() {
  const s = S.sel, r = S.by[s];
  if (!s || !r) { $("help").innerHTML = helpHtml(); return; }
  $("hd").innerHTML = `<h2>${E(s)}</h2><span class="nm">${E(r.name || "")}</span><span class="px">${px(r.price)}</span><span class="${cls(r.change_pct)}">${pct(r.change_pct)}</span><span class="chip ${side(r.bias)}">${sideTxt(r.bias)} bias</span><span class="mu"><span class="dot${r.live ? " on" : ""}"></span>${r.live ? "LIVE" : "CLOSED"}</span>`;
  $("kv").innerHTML = [["Day high", px(r.day_high ?? r.today_high)], ["Day low", px(r.day_low ?? r.today_low)], ["ATR", px(r.atr)], ["Move vs ATR", r.move_atr != null ? Number(r.move_atr).toFixed(2) + "×" : "–"]].map(([k, v]) => `<div><i>${k}</i><b>${v}</b></div>`).join("");
  const g = gexOf(s), q = encodeURIComponent(s);
  $("links").innerHTML = [["Bias page", `/bias/`], ["Trendline Hero", `/scanners/trendline-hero/?s=${q}`], ["Confluence", `/scanners/confluence/?s=${q}`], ["God-father", `/scanners/godfather/`], ["Next Candle AI", `/scanners/next-candle/`], ["AI Forecast", `/scanners/forecast-24h/`], ["Backtest", `/backtesting/`], g ? ["GEX", `/scanners/gex/#${g}`] : null].filter(Boolean).map(([t, u]) => `<a href="${u}">${t} ↗</a>`).join("");
  const v = $("vw");
  if (S.view === "CHART") { v.innerHTML = `<div class="tfb">${["10M", "1H", "4H", "1D", "1W"].map(t => `<button class="${t === S.tf ? "on" : ""}" data-tf="${t}">${t}</button>`).join("")}<span class="mu" style="margin-left:8px">day high/low · GEX walls · confluence zone</span></div><div id="chart"></div>`; drawChart(s); }
  else if (S.view === "WHY") v.innerHTML = `<div class="list">${why(s)}</div>`;
  else if (S.view === "GEX") v.innerHTML = g ? `<iframe title="GEX ${E(g)}" src="/scanners/gex/?embed=1#${g}"></iframe>` : `<div class="empty">No options gamma for ${E(s)}. GEX covers US indices and mega-caps, NIFTY, BANKNIFTY, FINNIFTY, Gold/Silver ETFs, BTC and ETH.</div>`;
  else if (S.view === "ZONES") v.innerHTML = `<iframe title="Confluence chart ${E(s)}" src="/scanners/confluence/?s=${q}"></iframe>`;
  else if (S.view === "NEWS") { const n = S.nw.filter(x => x.symbol === s); v.innerHTML = n.length ? `<div class="list">${n.flatMap(x => x.stories || []).map(st => `<div class="it"><a href="${E(st.u)}" target="_blank" rel="noopener nofollow">${E(st.t)}</a> <span class="mu">${E(st.src || "")}</span></div>`).join("")}</div>` : `<div class="empty">No tagged news for ${E(s)} right now.</div>`; }
  else { const st = setupsFor(s); v.innerHTML = `<div class="list"><div class="it am">ACTIVE SETUPS</div>${st.length ? st.map(x => `<div class="it">${x}</div>`).join("") : `<div class="it mu">No graded setup on ${E(s)} right now.</div>`}<div class="it am">UPCOMING EVENTS FOR THIS MARKET</div>${eventsFor(s).slice(0, 6).map(evRow).join("") || `<div class="it mu">No scheduled event this week.</div>`}<div class="it mu">Tip: <b class="am">${E(s)} CHART</b> · <b class="am">${E(s)} WHY</b> · <b class="am">${E(s)} GEX</b> · <b class="am">${E(s)} NEWS</b></div></div>`; }
}
function helpHtml() {
  return `<b>COMMANDS</b><br><br><b>XAUUSD</b> or <b>GC=F</b> · open a market<br><b>NIFTY GEX</b> · gamma levels<br><b>BTC CHART</b> · live chart with day high/low, GEX walls and zone<br><b>XAUUSD WHY</b> · analyst summary: why it is moving<br><b>EURUSD ZONES</b> · confluence chart<br><b>CAL</b> economic calendar · <b>ALERTS</b> alert center · <b>SCREEN</b> screener · <b>JOURNAL</b> EA trade log<br><b>AAPL NEWS</b> · tagged news<br><b>GF</b> God-father · <b>CF</b> Confluence · <b>TL</b> Trendline Hero · <b>NC</b> Next Candle · <b>AI</b> Forecast · <b>BT</b> Backtest · <b>API</b> MT5 auto-entry<br><b>US · INDIA · FX · CMDTY · CRYPTO</b> · filter the watchlist<br><br>Click any row in the right panels to open it here.`;
}
function drawRight() {
  $("gf").innerHTML = S.gf.map(r => `<tr class="r" data-s="${E(r.symbol)}"><td><span class="chip a">${E(r.grade)}</span></td><td>${E(r.symbol)}</td><td><span class="chip ${side(r.side)}">${sideTxt(r.side)}</span></td><td class="mu">${E((r.setup_name || "").slice(0, 22))}</td></tr>`).join("") || `<tr><td class="empty">No A+ / A setup on live markets right now.</td></tr>`;
  $("gfn").textContent = S.gf.length;
  $("cf").innerHTML = S.cf.map(r => `<tr class="r" data-s="${E(r.symbol)}"><td>${E(r.symbol)}</td><td><span class="chip ${side(r.bias)}">${sideTxt(r.bias)}</span></td><td class="am">${E(r.stage_name)}</td><td class="mu">${px(r.zone?.[0])}</td></tr>`).join("") || `<tr><td class="empty">No zone at rejection / GO on live markets.</td></tr>`;
  $("cfn").textContent = S.cf.length;
  const hi = S.nw.filter(x => x.imp === "high").slice(0, 25);
  $("nw").innerHTML = hi.map(x => { const st = (x.stories || [])[0] || {}; return `<div class="it"><a href="#" data-s="${E(x.symbol)}" class="am">${E(x.symbol)}</a> <span class="${x.side === "UP" ? "up" : x.side === "DOWN" ? "dn" : "mu"}">${E(x.side || "")}</span> · <a href="${E(st.u || "#")}" target="_blank" rel="noopener nofollow">${E(st.t || "")}</a></div>`; }).join("") || `<div class="empty">No high-impact news in the last hours.</div>`;
  $("nwn").textContent = hi.length;
}
function drawTick() {
  const m = [...S.rows].filter(r => r.change_pct != null).sort((a, b) => Math.abs(b.change_pct) - Math.abs(a.change_pct)).slice(0, 30);
  const h = m.map(r => `<span>${E(r.symbol)} <b class="${cls(r.change_pct)}">${pct(r.change_pct)}</b></span>`).join("");
  $("tk").innerHTML = h + h;
}
// ---------- economic calendar ----------
const CURS = s => { const m = /^([A-Z]{3})([A-Z]{3})=X$/.exec(s); if (m) return [m[1], m[2]]; if (/\.NS$|^\^NSE|^\^CNX|NIFTY/.test(s)) return ["INR"]; if (/^\^FTSE|\.L$/.test(s)) return ["GBP"]; if (/^\^GDAXI|\.DE$/.test(s)) return ["EUR"]; if (/^\^N225|\.T$/.test(s)) return ["JPY"]; return ["USD"]; };
const ist = t => new Date(t * 1000).toLocaleString("en-IN", { weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" });
const until = t => { const d = t - Date.now() / 1000; if (d < -3600) return "done"; if (d < 0) return "just out"; const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60); return h ? `in ${h}h ${m}m` : `in ${m}m`; };
const evRow = e => `<div class="it"><span class="imp-${E(e.impact)}">●</span> ${ist(e.t)} IST · <b>${E(e.cur)}</b> ${E(e.title)} <span class="mu">${e.forecast ? "f " + E(e.forecast) : ""} ${e.previous ? "p " + E(e.previous) : ""} · ${until(e.t)}</span></div>`;
function eventsFor(s) { const c = CURS(s), now = Date.now() / 1000; return S.econ.filter(e => c.includes(e.cur) && e.t > now - 3600 && (e.impact === "High" || e.impact === "Medium")); }
function drawNext() { const now = Date.now() / 1000, n = S.econ.find(e => e.impact === "High" && e.t > now - 300); $("nx").textContent = n ? `NEXT HIGH: ${n.cur} ${n.title.slice(0, 28)} ${until(n.t)}` : ""; }
// ---------- native chart ----------
async function drawChart(s) {
  const box = $("chart"); if (!box) return;
  if (!window.LightweightCharts) { box.innerHTML = `<div class="empty">Chart library loading… try again in a moment.</div>`; return; }
  const d = await J(`/api.php?r=symbol&sym=${encodeURIComponent(s)}&tf=${S.tf}`);
  if (!d || !d.candles || !d.candles.t) { box.innerHTML = `<div class="empty">No candles for ${E(s)} on ${S.tf} yet.</div>`; return; }
  if (S.sel !== s || !$("chart")) return;
  box.innerHTML = "";

  const cs = ch.addCandlestickSeries({ upColor: "#1ee08a", downColor: "#ff4d6a", wickUpColor: "#1ee08a", wickDownColor: "#ff4d6a", borderVisible: false });
  const c = d.candles; cs.setData(c.t.map((t, i) => ({ time: t, open: c.o[i], high: c.h[i], low: c.l[i], close: c.c[i] })));
  if (c.v && c.v.some(x => x > 0)) { const vs = ch.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" } }); ch.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } }); vs.setData(c.t.map((t, i) => ({ time: t, value: c.v[i] || 0, color: c.c[i] >= c.o[i] ? "rgba(30,224,138,.35)" : "rgba(255,77,106,.35)" }))); }
  const line = (p, color, title, style = 2) => { if (p) cs.createPriceLine({ price: Number(p), color, lineWidth: 1, lineStyle: style, axisLabelVisible: true, title }); };
  const r = S.by[s] || {}; line(r.day_high ?? r.today_high, "#ffb02e", "Day H"); line(r.day_low ?? r.today_low, "#ffb02e", "Day L");
  const g = gexOf(s), b = g && S.board.find(x => x.symbol === g);
  if (b && b.spot && r.price) { const k = Number(r.price) / Number(b.spot); line(b.call_wall * k, "#ff5a5f", "Call wall", 0); line(b.put_wall * k, "#21c77a", "Put wall", 0); line(b.zero_gamma * k, "#5aa9ff", "Zero γ", 1); }
  const z = S.cf.find(x => x.symbol === s); if (z && z.zone) { line(z.zone[0], "#c9a227", "Zone", 0); line(z.zone[1], "#c9a227", "Zone", 0); }
  ch.timeScale().fitContent(); S.chart = ch;
}
// ---------- analyst summary (rule-based, from live ChartPulse data) ----------
function why(s) {
  const r = S.by[s]; if (!r) return "";
  const L = [], mv = Number(r.move_atr), ch = Number(r.change_pct);
  L.push(`<div class="it am">WHY IS ${E(s)} MOVING?</div>`);
  L.push(`<div class="it">${E(s)} is ${ch >= 0 ? "up" : "down"} <b class="${cls(ch)}">${pct(ch)}</b> today${isFinite(mv) ? `, about <b>${Math.abs(mv).toFixed(1)}×</b> its daily ATR — ${Math.abs(mv) >= 1.5 ? "a stretched, unusual move" : Math.abs(mv) >= 0.8 ? "a normal full-day move" : "a quiet day so far"}` : ""}.</div>`);
  L.push(`<div class="it">Trend bias: <span class="chip ${side(r.bias)}">${sideTxt(r.bias)}</span>. ${r.live ? "Market is live." : "Market is closed; levels are from the last session."}</div>`);
  const n = S.nw.find(x => x.symbol === s);
  if (n) L.push(`<div class="it">News: ${n.n24 || n.n} stories in 24h, tone <b class="${n.side === "UP" ? "up" : n.side === "DOWN" ? "dn" : "mu"}">${E(n.side || "mixed")}</b>${n.imp === "high" ? ", <b class='dn'>high impact</b>" : ""}. Latest: ${E(((n.stories || [])[0] || {}).t || "")}</div>`);
  else L.push(`<div class="it mu">No tagged news — the move looks technical or flow-driven.</div>`);
  const g = gexOf(s), b = g && S.board.find(x => x.symbol === g);
  if (b) L.push(`<div class="it">Dealer gamma (${E(g)}): <b>${/pos/i.test(b.regime || "") || Number(b.net_gex) > 0 ? "positive — moves tend to be absorbed, ranges and reversals favoured" : "negative — moves tend to extend, breakouts favoured"}</b>. Call wall ${px(b.call_wall)}, put wall ${px(b.put_wall)}.</div>`);
  const st = setupsFor(s); if (st.length) L.push(`<div class="it">Setups: ${st.join(" · ")}</div>`);
  const ev = eventsFor(s).filter(e => e.impact === "High").slice(0, 2); if (ev.length) L.push(`<div class="it">Scheduled risk: ${ev.map(e => `${E(e.cur)} ${E(e.title)} ${until(e.t)}`).join(" · ")}</div>`);
  L.push(`<div class="it mu">Built from ChartPulse data (trend engine, news scanner, GEX, scanners, calendar). Not financial advice.</div>`);
  return L.join("");
}
// ---------- global views ----------
function showGlobal(k) {
  S.sel = null; $("hd").innerHTML = `<h2>${k}</h2>`; $("kv").innerHTML = ""; $("links").innerHTML = ""; const v = $("vw");
  history.replaceState(null, "", "#" + k);
  if (k === "CAL") {
    const f = LS.get("calImp", "High"); const now = Date.now() / 1000;
    const ev = S.econ.filter(e => e.t > now - 6 * 3600 && (f === "All" || e.impact === f || (f === "Medium" && e.impact === "High")));
    v.innerHTML = `<div class="frm">Impact <select id="ci">${["High", "Medium", "All"].map(x => `<option${x === f ? " selected" : ""}>${x}</option>`).join("")}</select><span class="mu">Times in IST. High-impact events lock MT5 auto-entry 20 min either side.</span></div><div class="bd list">${ev.map(evRow).join("") || `<div class="empty">Calendar not available right now.</div>`}</div>`;
    $("ci").onchange = e => { LS.set("calImp", e.target.value); showGlobal("CAL"); };
  } else if (k === "ALERTS") {
    v.innerHTML = `<div class="frm"><label><input type="checkbox" id="ao" ${S.alertsOn ? "checked" : ""}> Desktop alerts for new God-father A+ / A and Confluence GO</label><a class="am" href="/scanners/godfather/">Telegram alerts ↗</a></div><div class="bd list">${S.alerts.map(a => `<div class="it">${a.t} · <a href="#" data-s="${E(a.s)}" class="am">${E(a.s)}</a> ${a.m}</div>`).join("") || `<div class="empty">No alerts yet in this session. New A+ / A and GO setups appear here as they happen.</div>`}</div>`;
    $("ao").onchange = async e => { S.alertsOn = e.target.checked; LS.set("alerts", S.alertsOn); if (S.alertsOn && "Notification" in window && Notification.permission === "default") await Notification.requestPermission(); };
  } else if (k === "SCREEN") {
    const F = LS.get("scr", { live: true, bias: "ANY", mv: 0, setup: false });
    const rows = S.rows.filter(r => (!F.live || r.live) && (F.bias === "ANY" || sideTxt(r.bias) === F.bias) && Math.abs(Number(r.move_atr) || 0) >= Number(F.mv) && (!F.setup || setupsFor(r.symbol).length))
      .sort((a, b) => Math.abs(b.move_atr || 0) - Math.abs(a.move_atr || 0)).slice(0, 200);
    v.innerHTML = `<div class="frm"><label><input type="checkbox" id="f1" ${F.live ? "checked" : ""}> Live only</label> Bias <select id="f2">${["ANY", "BUY", "SELL"].map(x => `<option${x === F.bias ? " selected" : ""}>${x}</option>`).join("")}</select> Move ≥ <input id="f3" type="number" step="0.1" min="0" value="${F.mv}" style="width:60px">× ATR <label><input type="checkbox" id="f4" ${F.setup ? "checked" : ""}> Has a setup</label> <span class="mu">${rows.length} results</span></div><div class="bd"><table><tbody>${rows.map(r => `<tr class="r" data-s="${E(r.symbol)}"><td>${E(r.symbol)}</td><td>${px(r.price)}</td><td class="${cls(r.change_pct)}">${pct(r.change_pct)}</td><td>${r.move_atr != null ? Number(r.move_atr).toFixed(2) + "×" : "–"}</td><td><span class="chip ${side(r.bias)}">${sideTxt(r.bias)}</span></td><td class="mu">${setupsFor(r.symbol).length ? "setup" : ""}</td></tr>`).join("")}</tbody></table></div>`;
    const save = () => { LS.set("scr", { live: $("f1").checked, bias: $("f2").value, mv: Number($("f3").value) || 0, setup: $("f4").checked }); showGlobal("SCREEN"); };
    ["f1", "f2", "f3", "f4"].forEach(id => $(id).onchange = save);
  } else if (k === "JOURNAL") {
    v.innerHTML = `<div class="frm">Load your MT5 EA log (<code>MQL5/Files/ChartPulse_log.csv</code>): <input type="file" id="jf" accept=".csv"><span class="mu">Read in your browser only; nothing is uploaded.</span></div><div class="bd" id="jo"><div class="empty">Shows entries and skips by pattern, timeframe and reason.</div></div>`;
    $("jf").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => journal(String(rd.result)); rd.readAsText(f); };
  }
}
function journal(txt) {
  const L = txt.trim().split(/\r?\n/).slice(1).map(x => x.split(",")); const by = {};
  L.forEach(c => { const k = `${c[4] || "?"} · ${c[2] || "?"}`; const o = by[k] = by[k] || { n: 0, in: 0, sk: {} }; o.n++; if (/ENTERED/.test(c[5])) o.in++; else o.sk[c[5]] = (o.sk[c[5]] || 0) + 1; });
  $("jo").innerHTML = `<table><tbody><tr class="mu"><td>Pattern · TF</td><td>Found</td><td>Entered</td><td>Main skip reason</td></tr>${Object.entries(by).sort((a, b) => b[1].n - a[1].n).map(([k, o]) => { const top = Object.entries(o.sk).sort((a, b) => b[1] - a[1])[0]; return `<tr><td>${E(k)}</td><td>${o.n}</td><td class="up">${o.in}</td><td class="mu">${top ? E(top[0]) + " (" + top[1] + ")" : "–"}</td></tr>`; }).join("")}</tbody></table><div class="empty">${L.length} log lines. Profit per trade is in your MT5 account history; send this log to tune the rules.</div>`;
}
// ---------- alerts ----------
function checkAlerts() {
  const keys = new Set([...S.gf.map(r => `G|${r.symbol}|${r.side}|${r.grade}`), ...S.cf.filter(r => r.stage >= 5).map(r => `C|${r.symbol}|${r.bias}`)]);
  if (S.seen) {
    const t = new Date().toLocaleTimeString("en-IN", { hour12: false, timeZone: "Asia/Kolkata" });
    keys.forEach(k => { if (S.seen.has(k)) return; const [kind, s, sd, gr] = k.split("|"); const m = kind === "G" ? `God-father <span class="chip a">${E(gr)}</span> ${sideTxt(sd)}` : `Confluence GO ${sideTxt(sd)}`;
      S.alerts.unshift({ t, s, m }); if (S.alertsOn && "Notification" in window && Notification.permission === "granted") { try { new Notification(`ChartPulse: ${s}`, { body: m.replace(/<[^>]+>/g, "") }); } catch (e) {} } });
    S.alerts = S.alerts.slice(0, 100);
  }
  S.seen = keys;
}
function open(s, view) {
  s = String(s || "").toUpperCase().trim(); if (!s) return;
  const alias = { XAUUSD: "GC=F", GOLD: "GC=F", XAGUSD: "SI=F", SILVER: "SI=F", NIFTY: "^NSEI", BANKNIFTY: "^NSEBANK", FINNIFTY: "NIFTY_FIN_SERVICE.NS", BTC: "BTC-USD", BTCUSD: "BTC-USD", ETH: "ETH-USD", ETHUSD: "ETH-USD", SPX: "^GSPC", NDX: "^NDX", DOW: "^DJI", OIL: "CL=F", USOIL: "CL=F" };
  let k = alias[s] || s;
  if (!S.by[k] && S.by[k + "=X"]) k = k + "=X";
  if (!S.by[k] && S.by[k + "-USD"]) k = k + "-USD";
  if (!S.by[k]) { const f = S.rows.find(r => (r.name || "").toUpperCase().includes(s)); if (f) k = f.symbol; }
  if (!S.by[k]) { $("vw").innerHTML = `<div class="empty">Unknown symbol or command: ${E(s)}. Type HELP.</div>`; return; }
  S.sel = k; if (view) S.view = view;
  history.replaceState(null, "", "#" + encodeURIComponent(k) + (S.view !== "OVERVIEW" ? "/" + S.view : ""));
  drawTabs(); drawWatch(); drawSymbol();
}
function run(cmd) {
  const p = cmd.toUpperCase().trim().split(/\s+/); const a = p[0] || "";
  const go = { GF: "/scanners/godfather/", CF: "/scanners/confluence/", TL: "/scanners/trendline-hero/", NC: "/scanners/next-candle/", AI: "/scanners/forecast-24h/", BT: "/backtesting/", API: "/api/", GEX: "/scanners/gex/", NEWS: "/scanners/news/" };
  if (a === "HELP" || a === "?") { S.sel = null; $("hd").innerHTML = ""; $("kv").innerHTML = ""; $("links").innerHTML = ""; $("vw").innerHTML = `<div class="help">${helpHtml()}</div>`; return; }
  if (p.length === 1 && go[a] && !S.by[a] && a !== "NEWS") { location.href = go[a]; return; }
  if (a === "NEWS" && p.length === 1) { location.href = go.NEWS; return; }
  if (GLOBAL.includes(a)) { showGlobal(a); return; }
  if (MK.some(m => m[0] === a)) { S.mk = a; drawTabs(); drawWatch(); return; }
  const v = VIEWS.includes(p[p.length - 1]) && p.length > 1 ? p.pop() : null;
  open(p.join(" "), v || "OVERVIEW");
}
async function load() {
  const [sc, gf, cf, nw, gl, ec, bd] = await Promise.all([J("/api.php?r=scan"), J("/gf2_api.php"), J("/cf_api.php"), J("/tl_api.php?r=news"), S.gexList.length ? null : J("/gex_api.php?r=list"), J("/econ.php"), J("/gex_api.php?r=board")]);
  if (ec && Array.isArray(ec.events)) S.econ = ec.events;
  if (bd) S.board = Array.isArray(bd) ? bd : (bd.rows || bd.board || []);
  if (gl && gl.ok) S.gexList = [...(gl.US || []), ...(gl.IN || []), ...(gl.CR || [])];
  if (sc && Array.isArray(sc.rows)) { S.rows = sc.rows; S.by = Object.fromEntries(sc.rows.map(r => [r.symbol, r])); $("syms").innerHTML = sc.rows.slice(0, 1200).map(r => `<option value="${E(r.symbol)}">${E(r.name || "")}</option>`).join(""); }
  if (gf && Array.isArray(gf.rows)) S.gf = gf.rows.filter(r => r.grade === "A+" || r.grade === "A");
  if (cf && Array.isArray(cf.rows)) S.cf = cf.rows.filter(r => (r.stage || 0) >= 4);
  if (nw && Array.isArray(nw.rows)) S.nw = nw.rows;
  drawWatch(); drawRight(); drawTick(); checkAlerts();
  if (S.sel) { if (!["GEX", "ZONES", "CHART"].includes(S.view)) drawSymbol(); else { const r = S.by[S.sel]; if (r) $("hd").querySelector(".px") && ($("hd").querySelector(".px").textContent = px(r.price)); } }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-s],[data-k],[data-v],[data-tf],[data-g]"); if (!t) return;
  if (t.dataset.tf) { S.tf = t.dataset.tf; drawSymbol(); return; }
  if (t.dataset.g) { showGlobal(t.dataset.g); return; }
  if (t.dataset.k) { S.mk = t.dataset.k; drawTabs(); drawWatch(); }
  else if (t.dataset.v) { S.view = t.dataset.v; drawTabs(); if (S.sel) open(S.sel); else if (S.rows[0]) open(S.rows[0].symbol); }
  else if (t.dataset.s) { e.preventDefault(); open(t.dataset.s, "OVERVIEW"); }
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { run(e.target.value); e.target.value = ""; } });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
S.alertsOn = LS.get("alerts", false);
setInterval(drawNext, 30000);
setInterval(() => { const d = new Date(); $("clk").textContent = d.toUTCString().slice(17, 25) + " UTC · " + d.toLocaleTimeString("en-IN", { hour12: false, timeZone: "Asia/Kolkata" }) + " IST"; }, 1000);
drawTabs(); $("vw").innerHTML = `<div class="help">${helpHtml()}</div>`;
load().then(() => { drawNext(); const h = decodeURIComponent(location.hash.slice(1)); if (GLOBAL.includes(h)) showGlobal(h); else if (h) { const [s, v] = h.split("/"); open(s, VIEWS.includes(v) ? v : "OVERVIEW"); } });
setInterval(load, 60000);
</script>
